<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Support Document Upload</title><style>body{font:16px Arial;background:#f3f7f7}main{max-width:560px;margin:50px auto;background:white;padding:25px;border-radius:12px}input,button{display:block;margin:15px 0;padding:12px;width:100%;box-sizing:border-box}button{background:#168477;color:white;border:0;border-radius:7px}pre{white-space:pre-wrap}</style></head><body><main><h1>Upload Supporting Document</h1><p>PDF or PNG only. Maximum 1 MB.</p><form id="form"><input type="file" name="document" accept=".pdf,.png,application/pdf,image/png" required><button>Upload</button></form><pre id="result"></pre></main><script>
document.querySelector("#form").addEventListener("submit",async e=>{e.preventDefault();const out=document.querySelector("#result");out.textContent="Uploading...";try{const r=await fetch("/api/upload",{method:"POST",body:new FormData(e.target)});out.textContent=JSON.stringify(await r.json(),null,2);}catch(err){out.textContent=err.message;}});
</script></body></html>
