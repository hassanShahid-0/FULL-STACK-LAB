<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Campus Event Seat Desk</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <h1>Campus Event Seat Desk</h1>
        <p>Select up to four available seats.</p>
        <div id="seats" class="grid"></div>
        <section>
            <h2>Your Selection</h2>

            <p id="chosen">No seats selected</p>

            <h3>Total: Rs. <span id="total">0</span></h3>

            <button id="group">Add group of 2</button>

            <button id="book">Book Selected Seats</button>

            <button id="clear">Remove all</button>

            <p id="message"></p>
        </section>
    </main>
    <script type="module" src="app.js"></script>
</body>

</html>
