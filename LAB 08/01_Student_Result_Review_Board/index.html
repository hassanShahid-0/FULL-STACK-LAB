<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student Result Review Board</title><link rel="stylesheet" href="style.css"></head><body>
<main><h1>Student Result Review Board</h1><p>Search, filter and update student marks.</p>
<section class="stats"><article>Total <b id="total">0</b></article><article>Passing <b id="pass">0</b></article><article>Failing <b id="fail">0</b></article><article>Average <b id="average">0%</b></article></section>
<div class="tools"><input id="search" placeholder="Search student name"><select id="filter"><option value="all">All</option><option value="pass">Passing</option><option value="fail">Failing</option></select></div>
<p id="message"></p><section id="students"></section></main><script src="app.js"></script></body></html>
