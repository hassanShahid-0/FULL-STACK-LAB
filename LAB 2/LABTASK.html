<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Showcase</title>
    <link rel="stylesheet" href="LABTASK.css">
</head>

<body>

    <section class="team">

        <h2 class="team-title">Meet the Team</h2>
        <div class="row">
            <div class="col-md-6">First entry</div>
            <div class="col-md-6">Second entry</div>
        </div>

        <div class="card-row">

            <div class="card">
                <span class="badge">Featured</span>
                <div class="avatar"></div>
                <h3>Ayesha Khan</h3>
                <p class="role">Frontend Developer</p>
            </div>

            <div class="card">
                <div class="avatar"></div>
                <h3>Bilal Ahmed</h3>
                <p class="role">UI/UX Designer</p>
            </div>

            <div class="card">
                <div class="avatar"></div>
                <h3>Sara Malik</h3>
                <p class="role">Backend Developer</p>
            </div>

        </div>

        <div class="actions">
            <button class="btn">Contact</button>
            <button class="btn">View Portfolio</button>
            <button class="btn">Share</button>
        </div>

    </section>

</body>

</html>
