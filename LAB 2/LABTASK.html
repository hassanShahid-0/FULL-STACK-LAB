<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Showcase</title>

    <!-- TASK 5: Bootstrap CSS added -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="LABTASK.css">
</head>

<body>

    <section class="team">

        <h2 class="team-title">Meet the Team</h2>
        <div class="row">
            <div class="col-md-6">First entry</div>
            <div class="col-md-6">Second entry</div>
        </div>

        <!-- TASK 1: .card-row is the flex container holding three card items (flex, wrap and gap are set in CSS) -->
        <div class="card-row">

            <div class="card">
                <!-- TASK 2: this badge is positioned absolutely inside its position: relative parent (.card) -->
                <span class="badge">Featured</span>
                <div class="avatar"></div>
                <h3>Ayesha Khan</h3>
                <p class="role">Frontend Developer</p>
            </div>

            <div class="card">
                <div class="avatar"></div>
                <h3>Bilal Ahmed</h3>
                <p class="role">UI/UX Designer</p>
            </div>

            <div class="card">
                <div class="avatar"></div>
                <h3>Sara Malik</h3>
                <p class="role">Backend Developer</p>
            </div>

        </div>

        <!-- TASK 5: -->
        <div class="actions d-flex flex-wrap justify-content-center gap-3">
            <button class="btn">Contact</button>
            <button class="btn">View Portfolio</button>
            <button class="btn">Share</button>
        </div>

    </section>

</body>

</html>
