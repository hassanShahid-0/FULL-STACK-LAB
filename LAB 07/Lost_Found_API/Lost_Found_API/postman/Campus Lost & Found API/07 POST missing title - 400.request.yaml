$kind: http-request
name: 07 POST missing title -> 400
url: "{{baseUrl}}/api/items"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "category": "Accessories",
      "location": "Library",
      "status": "lost",
      "contactName": "Ali"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 400', () => pm.response.to.have.status(400));
      pm.test('Error mentions title', () => pm.expect(pm.response.json().error).to.include('title'));
    language: text/javascript
order: 7000
