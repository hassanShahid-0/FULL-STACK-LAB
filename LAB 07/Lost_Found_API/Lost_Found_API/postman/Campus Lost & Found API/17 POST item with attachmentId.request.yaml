$kind: http-request
url: "{{baseUrl}}/api/items"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "ID card",
      "category": "Accessories",
      "location": "Library",
      "status": "lost",
      "contactName": "Ali",
      "attachmentId": "{{attachmentId}}"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is 201', () => pm.response.to.have.status(201));
    language: text/javascript
order: 17000
