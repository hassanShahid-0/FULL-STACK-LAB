$kind: http-request
url: "{{baseUrl}}/api/items"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "Black wallet",
      "category": "Accessories",
      "location": "Library",
      "status": "lost",
      "contactName": "Ali"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 201', () => pm.response.to.have.status(201));
      const b = pm.response.json();
      pm.test('Item has generated string id', () => pm.expect(b.item.id).to.be.a('string'));
      pm.test('createdAt is present', () => pm.expect(b.item.createdAt).to.be.a('string'));
      pm.collectionVariables.set('itemId', b.item.id);
    language: text/javascript
order: 2000
