$kind: http-request
url: "{{baseUrl}}/api/items"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "Blue water bottle",
      "category": "Accessories",
      "location": "Cafeteria",
      "status": "found",
      "contactName": "Ali"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is 201', () => pm.response.to.have.status(201));
    language: text/javascript
order: 3000
