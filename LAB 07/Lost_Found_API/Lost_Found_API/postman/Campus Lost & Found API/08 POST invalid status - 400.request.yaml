$kind: http-request
name: 08 POST invalid status -> 400
url: "{{baseUrl}}/api/items"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "Black wallet",
      "category": "Accessories",
      "location": "Library",
      "status": "stolen",
      "contactName": "Ali"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is 400', () => pm.response.to.have.status(400));
    language: text/javascript
order: 8000
