$kind: http-request
name: 15 POST attachment too large (choose file > 2 MB) -> 413
url: "{{baseUrl}}/api/attachments"
method: POST
body:
  type: formdata
  content:
    - type: file
      key: attachment
      src: []
scripts:
  - type: afterResponse
    code: pm.test('Status is 413', () => pm.response.to.have.status(413));
    language: text/javascript
order: 15000
