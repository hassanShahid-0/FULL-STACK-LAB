$kind: http-request
name: 10 POST malformed JSON -> 400
url: "{{baseUrl}}/api/items"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{ "title": "Oops", '
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 400', () => pm.response.to.have.status(400));
      pm.test('Says malformed', () => pm.expect(pm.response.json().error).to.include('Malformed'));
    language: text/javascript
order: 10000
