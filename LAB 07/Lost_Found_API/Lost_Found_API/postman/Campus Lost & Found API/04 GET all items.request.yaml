$kind: http-request
url: "{{baseUrl}}/api/items"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      pm.test('Contains saved item', () => pm.expect(pm.response.json().items.some(i => i.id === pm.collectionVariables.get('itemId'))).to.be.true);
    language: text/javascript
order: 4000
