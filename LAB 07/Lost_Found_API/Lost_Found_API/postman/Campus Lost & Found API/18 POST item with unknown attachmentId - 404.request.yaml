$kind: http-request
name: 18 POST item with unknown attachmentId -> 404
url: "{{baseUrl}}/api/items"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "Black wallet",
      "category": "Accessories",
      "location": "Library",
      "status": "lost",
      "contactName": "Ali",
      "attachmentId": "11111111-1111-4111-8111-111111111111"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is 404', () => pm.response.to.have.status(404));
    language: text/javascript
order: 18000
